name: Auto-Generate Posts

on:
  workflow_dispatch:
  schedule:
    - cron: '0 12 * * 1' # Runs weekly on Monday at 12:00 UTC

permissions:
  contents: write

jobs:
  generate-post:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f scripts/requirements.txt ]; then
            pip install -r scripts/requirements.txt
          fi

      - name: Run autogen script
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ADMIN_API_URL: ${{ secrets.ADMIN_API_URL }}
          ADMIN_API_TOKEN: ${{ secrets.ADMIN_API_TOKEN }}
        run: python scripts/auto_generate_post.py --topic "a notable new AI tool worth showcasing" --publish false
        continue-on-error: true

      - name: Check for changes
        id: git-check
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push generated posts
        if: steps.git-check.outputs.has_changes == 'true'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add -A
          git commit -m "chore: auto-generate posts [automated]"
          git push

      - name: No changes detected
        if: steps.git-check.outputs.has_changes == 'false'
        run: echo "No changes generated in this run"