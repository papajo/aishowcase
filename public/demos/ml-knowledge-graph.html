  <div class="side">${ctl('gkS','Training step',0,10000,50,GK.step)}${ctl('gkW','Weight decay',0,1,.1,GK.wd)}
  <button class="btns" id="gkP">▶ Play training</button>
  <div class="stats">${stat('gkTr','Train acc')}${stat('gkVa','Val acc')}</div><div id="gkV" class="verdict"></div></div></div>
  <div class="insight"><h4>What a well-learned model looks like inside</h4><ul>
  <li><b>Memorized phase</b>: embeddings are scattered — each fact stored independently, like a hash table. Train 100%, validation near chance.</li>
  <li><b>Generalized phase</b>: the numbers arrange on a circle, and "+1" becomes the <i>same rotation</i> every time — so lines n→n+1 form a regular star. The model encodes the <b>rule</b>, so unseen sums work.</li>
  <li>Set weight decay to 0: training still hits 100%, but structure never forms — memorization is a stable solution without pressure toward simplicity.</li>
  <li>Inspired by work on grokking (Power et al., 2022) and its mechanistic analysis (Nanda et al., 2023), which found Fourier/circular features in models trained on modular addition.</li></ul></div>`;
  const upd=()=>{GK.step=+$('#gkS').value;GK.wd=+$('#gkW').value;$('#gkSV').textContent=GK.step;$('#gkWV').textContent=GK.wd;drawRep()};
  ['gkS','gkW'].forEach(i=>$('#'+i).oninput=upd);
  $('#gkP').onclick=()=>{if(GK.timer){clearInterval(GK.timer);GK.timer=null;$('#gkP').textContent='▶ Play training';return}
    if(GK.step>=10000)GK.step=0;$('#gkP').textContent='❚❚ Pause';GK.timer=setInterval(()=>{const el=$('#gkS');if(!el){clearInterval(GK.timer);GK.timer=null;return}GK.step=Math.min(10000,GK.step+80);el.value=GK.step;upd();if(GK.step>=10000){clearInterval(GK.timer);GK.timer=null;$('#gkP').textContent='▶ Play training'}},40)};
  drawRep();
}
const sig=x=>1/(1+Math.exp(-x));
const gkTrain=t=>.08+.92*sig((t-700)/130);
const gkVal=(t,wd)=>wd<=0?.08+.07*sig((t-3000)/900):.08+.9*sig((t-(1800+5200*(1-wd)))/320);
function drawRep(){
  const {g,w,h}=cv($('#gkA'));const p=28;axes(g,w,h,p);const X=t=>p+t/10000*(w-p*1.5),Y=a=>h-p-a*(h-p*1.6);
  g.fillStyle='#8b98a8';g.font='10px Inter';g.fillText('100%',0,Y(1)+3);g.fillText('0',14,Y(0)+3);g.fillText('steps →',w-50,h-8);
  [[gkTrain,'#4cc9f0'],[t=>gkVal(t,GK.wd),'#f9a826']].forEach(([fn,col])=>{g.strokeStyle=col;g.lineWidth=2.2;g.beginPath();for(let i=0;i<=300;i++){const t=i/300*1e4;i?g.lineTo(X(t),Y(fn(t))):g.moveTo(X(t),Y(fn(t)))}g.stroke()});
  g.strokeStyle='#c77dff';g.setLineDash([4,4]);g.beginPath();g.moveTo(X(GK.step),p/2);g.lineTo(X(GK.step),h-p);g.stroke();g.setLineDash([]);
  const tr=gkTrain(GK.step),va=gkVal(GK.step,GK.wd),prog=Math.max(0,Math.min(1,(va-.1)/.86));
  $('#gkTr').textContent=(tr*100).toFixed(0)+'%';$('#gkVa').textContent=(va*100).toFixed(0)+'%';
  const e=cv($('#gkB'));const G=e.g,W=e.w,H=e.h,cx=W/2,cy=H/2,rad=Math.min(W,H)*.36;const r=rng(42);
  const init=[...Array(12)].map(()=>[(r()*2-1)*rad*1.2,(r()*2-1)*rad*1.0]);
  const mem=Math.min(1,tr);
  const pts=[...Array(12)].map((_,k)=>{const a=2*Math.PI*((k*5)%12)/12-Math.PI/2;const c=[Math.cos(a)*rad,Math.sin(a)*rad];const s=[init[k][0]*(.35+.65*mem),init[k][1]*(.35+.65*mem)];return[cx+s[0]+(c[0]-s[0])*prog,cy+s[1]+(c[1]-s[1])*prog]});
  G.strokeStyle=`rgba(199,125,255,${.15+.6*prog})`;G.lineWidth=1.4;G.beginPath();pts.forEach((p,k)=>{const q2=pts[(k+1)%12];G.moveTo(p[0],p[1]);G.lineTo(q2[0],q2[1])});G.stroke();
  if(prog>.5){G.strokeStyle=`rgba(139,152,168,${(prog-.5)})`;G.setLineDash([3,4]);G.beginPath();G.arc(cx,cy,rad,0,7);G.stroke();G.setLineDash([])}
  pts.forEach((p,k)=>{G.fillStyle='#1c2430';G.strokeStyle='#c77dff';G.lineWidth=2;G.beginPath();G.arc(p[0],p[1],13,0,7);G.fill();G.stroke();G.fillStyle='#e6edf3';G.font='600 12px JetBrains Mono';G.textAlign='center';G.fillText(k,p[0],p[1]+4)});G.textAlign='left';
  const V=$('#gkV');
  if(tr<.5){V.className='verdict v-warn';V.innerHTML='<b>Early training</b>Neither memorized nor learned yet.'}
  else if(va<.4){V.className='verdict v-bad';V.innerHTML=`<b>Memorized</b>Train ${(tr*100).toFixed(0)}%, validation ${(va*100).toFixed(0)}%. Embeddings have no shared structure.${GK.wd<=0?' With zero weight decay this phase may never end.':''}`}
  else if(va<.9){V.className='verdict v-warn';V.innerHTML='<b>Grokking in progress</b>Structure is forming; validation is climbing.'}
  else{V.className='verdict v-good';V.innerHTML='<b>Generalized</b>Numbers sit on a circle and +1 is a fixed rotation — the model encodes the rule itself.'}
}

/* ---------------- LAB: gradient descent ---------------- */
const GDS={lr:-1,mom:0,cond:8,sx:-4.2,sy:3};
function labGD(M){
  M.innerHTML=`<div class="labhead"><h2>Gradient descent: learning-rate intuition</h2><p>Loss surface f(x, y) = ½(κ·x² + y²). κ is the condition number: how much steeper one direction is. Click the plot to choose a start point.</p></div>
  <div class="labgrid"><div><div class="plot"><canvas id="gdC" style="height:380px;cursor:crosshair"></canvas><div class="cap"><span>Ellipses = loss contours · dots = 60 optimizer steps</span></div></div>
  <div class="plot" style="margin-top:12px"><canvas id="gdL" style="height:150px"></canvas><div class="cap"><span>Loss per step (log scale)</span></div></div></div>
  <div class="side">${ctl('gdLr','Learning rate η (log)',-3,.4,.01,GDS.lr)}${ctl('gdM','Momentum β',0,.95,.05,GDS.mom)}${ctl('gdK','Condition number κ',1,30,1,GDS.cond)}
  <div class="stats">${stat('gdE','η · λmax')}${stat('gdF','Final loss')}</div><div id="gdV" class="verdict"></div></div></div>
  <div class="insight"><h4>Rules of thumb</h4><ul><li>For plain GD on a quadratic, it's stable only if <b>η · λmax &lt; 2</b> (λmax = the steepest curvature, here max(κ, 1)). Cross it → divergence.</li>
  <li>High κ (a long, narrow valley) forces a small η for the steep direction, which crawls along the shallow one. That's why <b>momentum</b> and adaptive methods (Adam) help.</li>
  <li>Try: κ=20, η just below the limit → zig-zag. Add momentum 0.8 → faster progress along the valley.</li></ul></div>
  <div class="labquiz" id="gdQ"></div>`;
  const upd=()=>{GDS.lr=+$('#gdLr').value;GDS.mom=+$('#gdM').value;GDS.cond=+$('#gdK').value;$('#gdLrV').textContent=(10**GDS.lr).toFixed(4);$('#gdMV').textContent=GDS.mom;$('#gdKV').textContent=GDS.cond;drawGD()};
  ['gdLr','gdM','gdK'].forEach(i=>$('#'+i).oninput=upd);
  $('#gdC').onclick=e=>{const r=e.target.getBoundingClientRect();GDS.sx=((e.clientX-r.left)/r.width*2-1)*5;GDS.sy=-((e.clientY-r.top)/r.height*2-1)*4;drawGD()};
  upd();
  labQuiz($('#gdQ'),[{q:`κ = 10 and η = 0.24, plain GD (no momentum). What happens?`,o:[
    [`Smooth convergence`,0,`η·λmax = 2.4 > 2 — the steep direction overshoots more each step.`],
    [`Divergence along the steep (x) direction`,1,`Each step multiplies x by (1 − 2.4) = −1.4: growing oscillation.`],
    [`Slow convergence only along y`,0,`y is fine (factor 0.76), but x blows up first.`],
    [`Nothing — learning rate doesn't affect stability`,0,`It's the main stability knob.`]]}],'gd');
}
function drawGD(){
  const lr=10**GDS.lr,b=GDS.mom,k=GDS.cond;const f=(x,y)=>.5*(k*x*x+y*y);
  const {g,w,h}=cv($('#gdC'));const X=x=>(x/5+1)/2*w,Y=y=>(1-y/4)/2*h;
  [.1,.5,1.5,4,9,18,35,70,140].forEach((c,i)=>{g.strokeStyle=`rgba(88,166,255,${.5-i*.045})`;g.lineWidth=1;g.beginPath();g.ellipse(X(0),Y(0),Math.sqrt(2*c/k)/5*w/2,Math.sqrt(2*c)/4*h/2,0,0,7);g.stroke()});
  let x=GDS.sx,y=GDS.sy,vx=0,vy=0;const path=[[x,y]],loss=[f(x,y)];
  for(let i=0;i<60;i++){vx=b*vx-lr*k*x;vy=b*vy-lr*y;x+=vx;y+=vy;path.push([x,y]);loss.push(f(x,y));if(!isFinite(loss[loss.length-1])||loss[loss.length-1]>1e8)break}
  g.strokeStyle='#f9a826';g.lineWidth=1.6;g.beginPath();path.forEach((p,i)=>{const px=Math.max(-50,Math.min(w+50,X(p[0]))),py=Math.max(-50,Math.min(h+50,Y(p[1])));i?g.lineTo(px,py):g.moveTo(px,py)});g.stroke();
  path.forEach((p,i)=>{g.fillStyle=i===0?'#fff':`hsl(${35+i*2},90%,${60-i*.3}%)`;g.beginPath();g.arc(X(p[0]),Y(p[1]),i===0?5:3,0,7);g.fill()});
  g.fillStyle='#3fb950';g.beginPath();g.arc(X(0),Y(0),5,0,7);g.fill();
  const e=cv($('#gdL'));const G=e.g,W=e.w,H=e.h,q=24;axes(G,W,H,q);
  const YY=v=>{const l=Math.log10(Math.max(1e-6,Math.min(v,1e6)));return q/2+(1-(l+6)/12)*(H-q*1.5)};
  G.strokeStyle='#c77dff';G.lineWidth=2;G.beginPath();loss.forEach((v,i)=>{const xx=q+i/60*(W-q*1.5);i?G.lineTo(xx,YY(v)):G.moveTo(xx,YY(v))});G.stroke();
  const eff=lr*Math.max(k,1),fin=loss[loss.length-1];
  $('#gdE').textContent=eff.toFixed(2);$('#gdF').textContent=!isFinite(fin)||fin>1e6?'∞':fin<1e-4?fin.toExponential(1):fin.toFixed(3);
  const V=$('#gdV');
  if(!isFinite(fin)||fin>loss[0]){V.className='verdict v-bad';V.innerHTML=`<b>Diverging</b>${b>0?'With momentum the stable range shrinks/changes; ':''}η·λmax = ${eff.toFixed(2)}. Correction: lower η below ≈ ${(2/Math.max(k,1)).toFixed(3)}${b>0?' or reduce momentum':''}.`}
  else if(fin<1e-3){V.className='verdict v-good';V.innerHTML=`<b>Converged</b>Reached the minimum in ≤ 60 steps.`}
  else if(eff<.05){V.className='verdict v-warn';V.innerHTML=`<b>Too slow</b>Tiny steps. Correction: raise η (or add momentum).`}
  else{V.className='verdict v-warn';V.innerHTML=`<b>Progressing, not done</b>Likely zig-zagging in the narrow direction or crawling in the wide one. Try momentum.`}
}

/* ---------------- LAB: attention ---------------- */
const AT={q:7,end:'tired',temp:1};
function labAttn(M){
  M.innerHTML=`<div class="labhead"><h2>Attention lens: what does "it" look at?</h2><p>Click a token to make it the <b>query</b>. Bars show how much it attends to every token. Swap the last word and watch "it" change its mind. (Hand-set weights for teaching — a real head is learned and messier.)</p></div>
  <div class="row" style="margin-bottom:12px"><span style="color:var(--muted);font-size:13px">Last word:</span><button class="btns" id="atT">tired</button><button class="btns" id="atW">wide</button></div>
  <div id="atToks" style="margin-bottom:14px"></div>
  <div class="labgrid"><div><div class="plot"><div class="bars" id="atBars"></div></div>
  <div class="plot" style="margin-top:12px"><canvas id="atH" style="height:420px"></canvas><div class="cap"><span>Full attention matrix: row = query, column = key. Brighter = more weight. Each row sums to 1.</span></div></div></div>
  <div class="side">${ctl('atTe','Softmax temperature',.3,3,.1,AT.temp)}<div class="verdict v-warn"><b>Correction to a common misconception</b>Attention weights are <i>not</i> parameters. The learned parameters are W<sub>Q</sub>, W<sub>K</sub>, W<sub>V</sub>; the weights are recomputed for every input — that's why one word changes everything.</div>
  <div class="verdict v-warn"><b>Second caution</b>One head's attention pattern isn't a full explanation of the model's decision. Other heads, layers and MLPs also matter.</div></div></div>
  <div class="labquiz" id="atQ"></div>`;
  $('#atT').onclick=()=>{AT.end='tired';drawAttn()};$('#atW').onclick=()=>{AT.end='wide';drawAttn()};
  $('#atTe').oninput=e=>{AT.temp=+e.target.value;$('#atTeV').textContent=AT.temp;drawAttn()};
  drawAttn();
  labQuiz($('#atQ'),[{q:`Changing "tired" → "wide" shifts "it" from "animal" to "street". What does that show?`,o:[
    [`The attention weights are fixed parameters learned in training`,0,`The projections are fixed; the weights are recomputed per input from Q·K.`],
    [`Attention weights depend on the whole context, computed fresh per input`,1,`Same parameters, different input → different weights.`],
    [`The model reads right to left`,0,`Attention isn't directional by itself; it's content-based.`],
    [`Temperature changed`,0,`Temperature only sharpens or flattens the same preferences.`]]},
   {q:`Lowering softmax temperature toward 0 makes attention…`,o:[
    [`More uniform`,0,`Higher temperature flattens; lower sharpens.`],
    [`Sharper — closer to one-hot on the top key`,1,`Dividing scores by a small T amplifies differences.`],
    [`Unchanged`,0,`Try the slider.`],
    [`Negative`,0,`Softmax outputs are always positive.`]]}],'attn');
}
function attnRows(){
  const T=['The','animal',"didn't",'cross','the','street','because','it','was','too',AT.end];const n=T.length;
  const S0=[...Array(n)].map((_,i)=>[...Array(n)].map((_,j)=>j===i?2:Math.abs(i-j)===1?1.2:0));
  const set=(i,j,v)=>S0[i][j]=v;
  set(0,1,2.4);set(4,5,2.4);set(2,3,2);set(3,1,1.6);set(3,5,1.8);set(6,3,1.2);set(9,10,2.2);set(8,7,1.6);
  if(AT.end==='tired'){set(7,1,3.6);set(7,5,.6);set(10,1,2.4);set(10,7,2.2)}else{set(7,5,3.6);set(7,1,.6);set(10,5,2.4);set(10,7,2.2)}
  const W=S0.map(r=>{const e=r.map(v=>Math.exp(v/AT.temp));const s=e.reduce((a,b)=>a+b,0);return e.map(v=>v/s)});
  return{T,W};
}
function drawAttn(){
  const {T,W}=attnRows();
  [['#atT','tired'],['#atW','wide']].forEach(([s,v])=>{const b=$(s);b.className=AT.end===v?'btnp':'btns'});
  $('#atToks').innerHTML=T.map((t,i)=>`<button class="tok ${i===AT.q?'on':''}" data-i="${i}">${t}</button>`).join('');
  $('#atToks').querySelectorAll('.tok').forEach(b=>b.onclick=()=>{AT.q=+b.dataset.i;drawAttn()});
  const row=W[AT.q],mx=Math.max(...row);
  $('#atBars').innerHTML=`<div style="font-size:13px;margin-bottom:8px;color:var(--muted)">Query: <b style="color:var(--text)">"${T[AT.q]}"</b> attends to…</div>`+row.map((v,j)=>`<div class="bar"><span>${T[j]}</span><div style="width:${v/mx*100}%;opacity:${.35+.65*v/mx}"></div><span>${(v*100).toFixed(0)}%</span></div>`).join('');
  const {g,w,h}=cv($('#atH'));const n=T.length,lp=70,tp=62,cs=Math.min((w-lp-10)/n,(h-tp-6)/n);
  g.font='11px JetBrains Mono';g.fillStyle='#8b98a8';
  T.forEach((t,i)=>{g.textAlign='right';g.fillStyle=i===AT.q?'#c77dff':'#8b98a8';g.fillText(t,lp-6,tp+i*cs+cs/2+4);g.save();g.translate(lp+i*cs+cs/2+4,tp-6);g.rotate(-Math.PI/3);g.textAlign='left';g.fillStyle='#8b98a8';g.fillText(t,0,0);g.restore()});
  W.forEach((r,i)=>r.forEach((v,j)=>{g.fillStyle=`rgba(199,125,255,${Math.min(1,v*1.6)})`;g.fillRect(lp+j*cs,tp+i*cs,cs-1.5,cs-1.5)}));
  g.strokeStyle='#f9a826';g.lineWidth=2;g.strokeRect(lp,tp+AT.q*cs,n*cs-1.5,cs-1.5);g.textAlign='left';
}

/* =========================================================
   LAB SHELL + PROGRESS
   ========================================================= */
let curLab=null;
const ti=()=>{const d=new Date();return Math.floor(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())/864e5)%LABS.length};
function openLab(id){curLab=id;show('labView');
  $('#labNav').innerHTML=`<h3>Interactive labs</h3>`+LABS.map((l,i)=>`<button class="labItem ${l.id===id?'on':''}" data-id="${l.id}">${l.short}${i===ti()?'<span class="badge">today</span>':''}<small>${l.t}</small></button>`).join('')+
  `<h3 style="margin-top:18px">Linked concept</h3><button class="lk" id="labNode">${byId[LABS.find(l=>l.id===id).node].t} →</button>`;
  $('#labNav').querySelectorAll('.labItem').forEach(b=>b.onclick=()=>openLab(b.dataset.id));
  $('#labNode').onclick=()=>{show('graphView');select(LABS.find(l=>l.id===id).node)};
  if(GK.timer){clearInterval(GK.timer);GK.timer=null}
  const M=$('#labMain');({memo:labMemo,gd:labGD,attn:labAttn})[id](M);M.scrollTop=0;
}
function renderProgress(){
  const P=$('#progView');
  const lv=[1,2,3].map(l=>{const a=N.filter(n=>n.l===l),m=a.filter(n=>mastered(n.id)).length;return`<div class="card"><span class="lvl lvl${l}">${LN[l]}</span><div style="font-size:22px;font-weight:700;margin-top:6px">${m} / ${a.length}</div><div class="meter"><div style="width:${m/a.length*100}%;background:${LC[l]}"></div></div></div>`}).join('');
  const nx=N.filter(n=>avail(n.id)&&!mastered(n.id));
  const weak={};S.mist.forEach(m=>{if(m.id)weak[m.id]=(weak[m.id]||0)+1});
  const weakL=Object.entries(weak).filter(([id])=>!mastered(id)).sort((a,b)=>b[1]-a[1]).slice(0,5);
  P.innerHTML=`<h2 style="margin:0 0 14px">Progress &amp; corrections</h2><div class="pgrid">${lv}</div>
  <div class="pgrid" style="margin-top:16px">
   <div class="card"><h3 style="margin:0 0 8px;font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.8px">Next up</h3>${nx.length?nx.slice(0,6).map(n=>`<div style="margin:6px 0"><button class="lk" data-go="${n.id}">${n.t}</button> <span class="lvl lvl${n.l}">${LN[n.l]}</span></div>`).join(''):'Everything available is mastered 🎉'}</div>
   <div class="card"><h3 style="margin:0 0 8px;font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.8px">Weak spots → review</h3>${weakL.length?weakL.map(([id,c])=>`<div style="margin:6px 0"><button class="lk" data-go="${id}">${byId[id].t}</button> <span style="color:var(--muted);font-size:12px">${c} miss${c>1?'es':''}${byId[id].pre.length?` · revisit ${byId[id].pre.map(p=>byId[p].t).join(', ')}`:''}</span></div>`).join(''):'<span style="color:var(--muted)">No open weak spots.</span>'}</div>
  </div>
  <div class="card" style="margin-top:16px;max-width:1100px"><h3 style="margin:0 0 6px;font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.8px">Correction log</h3>
  ${S.mist.length?S.mist.slice(0,15).map(m=>`<div class="mist"><span style="color:var(--bad)">✗</span><div><b>${m.id?byId[m.id].t:''}</b> <span style="color:var(--muted)">· ${m.kind}</span><div>Correct idea: ${m.text}</div></div></div>`).join(''):'<span style="color:var(--muted)">Mistakes and their corrections show up here.</span>'}</div>
  <div class="row" style="margin-top:16px"><button class="btns" id="rst">Reset all progress</button><span id="rstc" style="display:none">Sure? <button class="btns" id="rsty" style="border-color:var(--bad)">Yes, reset</button> <button class="btns" id="rstn">Cancel</button></span></div>`;
  P.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{show('graphView');select(b.dataset.go)});
  $('#rst').onclick=()=>$('#rstc').style.display='inline';$('#rstn').onclick=()=>$('#rstc').style.display='none';
  $('#rsty').onclick=()=>{S=blank();save();refreshGraph();renderProgress();toast('Progress reset')};
}
function show(v){document.querySelectorAll('.view').forEach(e=>e.classList.toggle('on',e.id===v));document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('on',t.dataset.v===v));
  if(v==='progView')renderProgress();if(v==='graphView'){requestAnimationFrame(()=>{if(!fit._done){fit();fit._done=1}})}}
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{if(t.dataset.v==='labView')openLab(curLab||LABS[ti()].id);else show(t.dataset.v)});
let rz;window.addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(()=>{if($('#labView').classList.contains('on')&&curLab)openLab(curLab)},200)});

/* init */
const TL=LABS[ti()];
$('#todayBox').innerHTML=`📌 Topic of the day: <b>${TL.short}</b><button id="todayGo">Open lab</button>`;
$('#todayGo').onclick=()=>openLab(TL.id);
place();refreshGraph();
const h0=location.hash.slice(1);
if(byId[h0])select(h0);else renderPanel();
requestAnimationFrame(()=>{fit();fit._done=1});
</script>
