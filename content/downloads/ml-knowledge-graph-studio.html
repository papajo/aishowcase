/* ---------- 1. Socratic ---------- */
function socLadder(T){const n=T.n;
  if(!n)return{q:[`What do you already know about ${T.label}? What problem does it solve?`,`Describe one concrete situation where ${T.label} is used.`,`What would go wrong without it?`,`What are its limits or failure modes?`,`Explain ${T.label} in two sentences to a classmate.`],r:[]};
  const w=n.q.o.find(o=>!o[1]);
  return{q:[`Before any definitions: what problem do you think "${n.t}" exists to solve?`,
    n.pre.length?`How might ${n.t} build on ${byId[n.pre[0]].t}? What does it need from it?`:`Where have you seen an idea like this outside computing?`,
    `Look at this example: "${strip(n.ex)}" — what's the key idea at work?`,
    `Question: "${strip(n.q.q)}" Someone answers "${strip(w[0])}". Agree or disagree? Why?`,
    `What would go wrong if someone misused or ignored ${n.t}?`,
    n.xb?n.xb.p:`Now explain ${n.t} in two sentences, as if to a classmate.`],
   r:[strip(n.s),null,null,`Correction: ${w[2]} The right answer: "${strip(n.q.o.find(o=>o[1])[0])}".`,null,n.xb?'xb':null]};
}
function stSocratic(B,T,M){
  const chat=(ST.chats[T.label]=ST.chats[T.label]||[]);
  B.innerHTML=head(M,T,'The tutor asks; you reason. It won\'t hand you the answer — a wrong turn gets the misconception named and a question that leads you to the fix.')+
  (AI?'':note(errMsg({code:'offline'})+' Offline mode walks a fixed question ladder.'))+
  `<div class="chat" id="chat"></div><div class="chatin"><textarea id="chIn" placeholder="Your answer… (Enter to send · Shift+Enter for new line)"></textarea>
  <div class="row" style="margin-top:6px"><button class="btnp" id="chSend">${chat.length?'Send':'Start session'}</button><button class="btns" id="chHint">I'm stuck — hint</button><button class="btns" id="chWrap">Wrap up &amp; show my gaps</button><button class="btns" id="chReset">Restart</button></div></div>`;
  const C=$('#chat'),inp=$('#chIn');
  const draw=()=>{C.innerHTML=chat.map(m=>`<div class="msg ${m.role}">${m.role==='assistant'?'<span class="who">Tutor</span>':m.role==='note'?'':'<span class="who" style="color:#9ecbff">You</span>'}${fmt(m.content)}</div>`).join('')||`<div class="empty" style="padding:10px">Press <b>Start session</b> — or first type what you already know about ${esc(T.label)}.</div>`;C.scrollTop=C.scrollHeight};
  draw();
  const sys=`You are a Socratic tutor. ${ctxOf(T)}
Rules: Ask exactly ONE question per turn. Never lecture or reveal the full answer up front. Begin by probing what the learner already knows, then build from simple to deep. When an answer is wrong or partly wrong, briefly name the specific misconception, then ask a question that lets them discover the fix. When they say they're stuck, give a small hint, not the answer. Use concrete examples and numbers where useful. Keep each turn under 90 words. After ~7 exchanges, or when asked to wrap up, give: **What you now understand**, **Gaps to work on**, and **One practice question**.`;
  let busy=false;
  async function turn(text){
    if(busy)return;
    const L=chat.filter(m=>m.role!=='note');
    if(text)chat.push({role:'user',content:text});
    if(!AI){offline(text);draw();return}
    busy=true;const msgs=[];const conv=chat.filter(m=>m.role!=='note');const first=conv[0]&&conv[0].role==='user'?conv[0].content:null;
    msgs.push({role:'user',content:sys+'\n\n'+(first?'Learner: '+first:'Begin with your first question.')});
    conv.slice(first?1:0).forEach(m=>msgs.push({role:m.role,content:m.content}));
    const ph={role:'assistant',content:'…'};chat.push(ph);draw();
    try{const r=await AI(msgs,{cache:false,onText:({text})=>{ph.content=text;draw()}});ph.content=r.text||ph.content}
    catch(e){chat.splice(chat.indexOf(ph),1);chat.push({role:'note',content:strip(errMsg(e))})}
    busy=false;draw();
  }
  function offline(text){const Ld=socLadder(T);const asked=chat.filter(m=>m.role==='assistant').length;
    let msg='';
    if(asked>0&&text){const r=Ld.r[asked-1];
      if(r==='xb'){const g=gradeExplain(T.n.xb,text);msg+=`💡 You covered ${g.score}/${T.n.xb.keys.length} key ideas. ${T.n.xb.keys.filter((k,i)=>!g.hits[i]).map(k=>'Missing: '+k[0]+'.').join(' ')}${g.traps.map(t=>' ⚠ '+t[1]).join('')}\n\n`}
      else if(r)msg+=`💡 Compare your thinking: ${r}\n\n`}
    if(asked<Ld.q.length)msg+=`**Q${asked+1}.** ${Ld.q[asked]}`;else msg+=`That's the full ladder. Try the **Bloom's challenges** or **Practice questions** next.`;
    chat.push({role:'assistant',content:msg})}
  const send=()=>{const v=inp.value.trim();if(!v&&chat.length)return;inp.value='';$('#chSend').textContent='Send';turn(v||null)};
  $('#chSend').onclick=send;inp.onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}};
  $('#chHint').onclick=()=>{if(!chat.length)return send();if(AI)turn("I'm stuck — give me a small hint, not the answer.");else{chat.push({role:'note',content:T.n?'Hint: '+strip(T.n.s).split('. ')[0]+'.':'Hint: think about what problem it solves and what would break without it.'});draw()}};
  $('#chWrap').onclick=()=>{if(AI)turn('Please wrap up now: what I understand, my gaps, and one practice question.');else{chat.push({role:'note',content:'Offline: review the 💡 notes above for gaps, then try Practice questions.'});draw()}};
  $('#chReset').onclick=()=>{ST.chats[T.label]=[];renderStudy()};
}

/* ---------- 2. Three levels ---------- */
function stLevels(B,T,M){
  B.innerHTML=head(M,T,'Same idea at three depths. Notice what each level adds — that difference is the learning.')+'<div id="out"></div>';
  const out=$('#out'),key='lv|'+T.label;
  const render=v=>{out.innerHTML=`<div class="lvgrid">${[['child','🧒 As if I\'m a child','#4cc9f0'],['high_school','🎒 High schooler','#f9a826'],['academic','🎓 Academic','#c77dff']].map(([k,l,c])=>`<div class="lvcard" style="border-top:3px solid ${c}"><h4 style="color:${c}">${l}</h4>${fmt(v[k]||'')}</div>`).join('')}</div>
    ${v.check_question?`<div class="insight"><h4>Check yourself</h4>${fmt(v.check_question)}<textarea id="lvA" style="margin-top:8px" placeholder="Answer at the level that clicked for you…"></textarea><div class="row" style="margin-top:6px"><button class="btnp" id="lvG">Get feedback</button></div><div id="lvF" style="margin-top:8px"></div></div>`:''}${regen('rg')}`;
    const g=$('#lvG');if(g)g.onclick=()=>feedback($('#lvF'),v.check_question,$('#lvA').value,T);
    const r=$('#rg');if(r)r.onclick=()=>go(true)};
  const fallback=m=>{out.innerHTML=note(m)+(T.n?`<div class="lvgrid"><div class="lvcard" style="border-top:3px solid #4cc9f0"><h4 style="color:#4cc9f0">🧒 Child</h4>${T.n.ex}</div><div class="lvcard" style="border-top:3px solid #f9a826"><h4 style="color:#f9a826">🎒 High schooler</h4>${T.n.s}</div><div class="lvcard" style="border-top:3px solid #c77dff"><h4 style="color:#c77dff">🎓 Academic</h4><pre>${esc(T.n.code)}</pre></div></div>`:'')};
  const go=f=>run(out,key,()=>askJSON(`Explain one concept three times for three audiences. ${ctxOf(T)}
- "child": a curious 8-year-old. No jargon. One everyday comparison. 3–4 short sentences.
- "high_school": 5–7 sentences. Introduce the key terms with plain definitions and one small worked or numeric example.
- "academic": 6–9 sentences. Precise terminology and notation where useful; state assumptions, limitations, and how it relates to neighboring methods.
- "check_question": one question that tests whether the learner can move up a level.
JSON schema: {"child":"","high_school":"","academic":"","check_question":""}`),render,fallback,f);
  go(false);
}

/* ---------- 3. Practice questions ---------- */
function stPractice(B,T,M){
  B.innerHTML=head(M,T,'Three tiers. Wrong answers come with a correction for that specific option.')+'<div id="out"></div>';
  const out=$('#out'),key='pr|'+T.label;let score={ok:0,tot:0};
  const conv=q=>({q:esc(q.q),o:(q.options||[]).map((o,i)=>[esc(o),i===q.answer?1:0,esc((q.why||[])[i]||'')])});
  const render=(sets,isOff)=>{
    out.innerHTML=`<div class="stat" style="max-width:220px;margin-bottom:12px"><small>Score this session</small><b id="prS">0 / 0</b></div>`+
    [['beginner','Beginner','lvl1'],['intermediate','Intermediate','lvl2'],['advanced','Advanced','lvl3']].map(([k,l,c])=>`<div class="sec"><h3><span class="lvl ${c}">${l}</span></h3>${(sets[k]||[]).map((_,i)=>`<div class="card" style="margin-bottom:10px" id="pq_${k}_${i}"></div>`).join('')||'<div class="empty">None available offline.</div>'}</div>`).join('')+(isOff?'':regen('rg'));
    ['beginner','intermediate','advanced'].forEach(k=>(sets[k]||[]).forEach((q,i)=>{const Q=isOff?q:conv(q);let first=true;
      mcq($('#pq_'+k+'_'+i),Q,false,ok=>{if(first){score.tot++;if(ok)score.ok++;first=false;$('#prS').textContent=`${score.ok} / ${score.tot}`}if(!ok)logMistake(T.n?T.n.id:null,'Practice ('+k+')',Q.o.find(o=>o[1])[0])},T.n||undefined)}));
    const r=$('#rg');if(r)r.onclick=()=>go(true)};
  const fallback=m=>{if(!T.n){out.innerHTML=note(m);return}const n=T.n;
    render({beginner:n.pre.map(p=>byId[p].q),intermediate:[n.q],advanced:n.next.map(p=>byId[p].q)},true);out.insertAdjacentHTML('afterbegin',note(m+' Using course questions from the prerequisites, this concept, and what it unlocks.'))};
  const go=f=>run(out,key,()=>askJSON(`Create practice multiple-choice questions. ${ctxOf(T)}
Make 3 "beginner" (recall & basic meaning), 3 "intermediate" (application, reading code or numbers, diagnosing a scenario), 3 "advanced" (edge cases, trade-offs, comparing methods, subtle misconceptions).
Each question: 4 options, exactly one correct, plausible distractors built from REAL common misconceptions. "why" gives one sentence per option: for the correct one why it's right, for each wrong one the specific correction.
JSON schema: {"beginner":[{"q":"","options":["","","",""],"answer":0,"why":["","","",""]}],"intermediate":[...],"advanced":[...]}. Vary the position of the correct answer.`,'default'),render,fallback,f);
  go(false);
}

/* ---------- 4. Summarize & compare ---------- */
const STOP=new Set('the a an and or of to in for on with by is are was were be been being this that these those it its as at from we our their they them which can could will would not but also using use used than then such into more most may might each other between both over under per via based paper results show shows shown has have had there here when where while what who how all any some one two three first second however thus therefore given since does did done well very many much new same different section figure table et al'.split(' '));
function topTerms(text,k){const w=text.toLowerCase().replace(/[^a-z0-9\s-]/g,' ').split(/\s+/).filter(x=>x.length>3&&!STOP.has(x)&&!/^[\d-]+$/.test(x));
  const c={};w.forEach(x=>c[x]=(c[x]||0)+1);for(let i=0;i<w.length-1;i++){const b=w[i]+' '+w[i+1];c[b]=(c[b]||0)+1.6}
  const s=Object.entries(c).filter(e=>e[1]>=2).sort((a,b)=>b[1]-a[1]).map(e=>e[0]);const out=[];
  for(const t of s){if(out.length>=k)break;if(!out.some(u=>u.includes(t)||t.includes(u)))out.push(t)}return out}
async function loadPdf(){if(window.pdfjsLib)return window.pdfjsLib;const add=s=>new Promise((r,j)=>{const e=document.createElement('script');e.src=s;e.onload=r;e.onerror=j;document.head.appendChild(e)});
  const b='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/';await add(b+'pdf.min.js');await add(b+'pdf.worker.min.js');return window.pdfjsLib}
async function readFile(f){if(/\.pdf$/i.test(f.name)){const L=await loadPdf();const d=await L.getDocument({data:await f.arrayBuffer()}).promise;let o='';
  for(let i=1;i<=Math.min(d.numPages,60);i++){const p=await d.getPage(i);o+=(await p.getTextContent()).items.map(x=>x.str).join(' ')+'\n'}return o}return await f.text()}
function sourceBox(id){return `<div class="card"><div class="row" style="justify-content:space-between"><b>Paper / source text</b><span class="row"><label class="btns" style="font-size:12px">📎 Upload .pdf/.txt/.md<input type="file" id="${id}F" accept=".pdf,.txt,.md,.html,.tex" hidden></label><button class="btns" style="font-size:12px" id="${id}N">Use this concept's notes</button></span></div>
  <textarea id="${id}P" style="min-height:150px;margin-top:8px" placeholder="Paste an abstract, paper, article or lecture notes…">${esc(ST.paper)}</textarea><div id="${id}I" style="font-size:12px;color:var(--muted)">${ST.paper?ST.paper.length.toLocaleString()+' characters':''}</div></div>`}
function bindSource(id,T){const P=$('#'+id+'P'),I=$('#'+id+'I');P.oninput=()=>{ST.paper=P.value;I.textContent=P.value.length.toLocaleString()+' characters'};
  $('#'+id+'F').onchange=async e=>{const f=e.target.files[0];if(!f)return;I.textContent='Reading '+f.name+'…';try{ST.paper=await readFile(f);P.value=ST.paper;I.textContent=f.name+' · '+ST.paper.length.toLocaleString()+' characters'+(ST.paper.length>60000?' (first 60,000 sent to Claude)':'')}catch(x){I.textContent='Couldn\'t read that file — paste the text instead.'}};
  $('#'+id+'N').onclick=()=>{if(!T.n){I.textContent='Pick a concept from the Topic list first.';return}const n=T.n;ST.paper=`${n.t}\n\n${strip(n.s)}\n\nExample: ${strip(n.ex)}\n\nCode:\n${n.code}`;P.value=ST.paper;I.textContent=ST.paper.length+' characters (course notes)'}}
function stSummary(B,T,M){
  B.innerHTML=head(M,{label:''},'Paste or upload a paper, write <b>your own</b> summary first, then compare against Claude\'s summary to find gaps and misreadings.')+sourceBox('su')+
  `<div class="card" style="margin-top:12px"><b>Your summary</b><textarea id="suM" style="min-height:110px;margin-top:8px" placeholder="Write it before you look at Claude's — that's where the learning happens.">${esc(ST.mine)}</textarea>
  <div class="row" style="margin-top:8px"><button class="btnp" id="suGo">Summarize &amp; compare</button><span style="font-size:12px;color:var(--muted)">Leave your summary empty to get just the paper summary + key concepts.</span></div></div><div id="out" style="margin-top:14px"></div>`;
  bindSource('su',T);const out=$('#out');$('#suM').oninput=e=>ST.mine=e.target.value;
  $('#suGo').onclick=()=>{const paper=ST.paper.trim(),mine=ST.mine.trim();if(paper.length<80){out.innerHTML=note('Add at least a paragraph of source text.');return}
    const key='su|'+hsh(paper+'|'+mine);
    const render=v=>{const sc=+v.score;out.innerHTML=`<div class="lvgrid" style="grid-template-columns:1fr 1fr">
      <div class="lvcard"><h4>📄 Paper summary</h4>${fmt(v.summary)}</div>
      <div class="lvcard"><h4>🔑 Key concepts</h4><ul class="ck">${(v.key_concepts||[]).map(k=>`<li><b>${esc(k.concept)}</b> — ${esc(k.why||'')}</li>`).join('')}</ul></div></div>
      ${mine?`<div class="insight" style="max-width:none"><h4>Your summary vs the paper ${isFinite(sc)?`· coverage ${sc}/100`:''}</h4>
      <div class="meter" style="margin:4px 0 10px"><div style="width:${sc||0}%;background:${sc>=75?'#3fb950':sc>=50?'#d29922':'#f85149'}"></div></div>
      ${(v.covered||[]).length?`<div>✅ <b>Captured:</b> ${v.covered.map(esc).join(' · ')}</div>`:''}
      ${(v.missing||[]).map(m=>`<div class="corr">⬜ <b>Gap: ${esc(m.concept)}</b> — ${esc(m.why_it_matters||'')}</div>`).join('')}
      ${(v.inaccurate||[]).map(m=>`<div class="corr">✗ <i>${esc(m.claim)}</i><br>→ ${esc(m.correction)}</div>`).join('')}
      ${v.next_step?`<div style="margin-top:8px;color:var(--muted)">Next: ${esc(v.next_step)}</div>`:''}</div>`:''}${regen('rg')}`;
      (v.inaccurate||[]).forEach(m=>logMistake(T.n?T.n.id:null,'Summary',esc(m.correction||'')));
      const r=$('#rg');if(r)r.onclick=()=>go(true)};
    const fallback=m=>{const terms=topTerms(paper,14),low=mine.toLowerCase();const hit=terms.filter(t=>t.split(' ').every(w=>low.includes(w.slice(0,Math.max(4,w.length-2)))));
      out.innerHTML=note(m+' Offline compare = keyword coverage only; it can\'t judge accuracy.')+`<div class="insight" style="max-width:none"><h4>Frequent terms in the source</h4>${terms.map(t=>`<span class="lk" style="display:inline-block;margin:2px;${hit.includes(t)?'border-color:#3fb950':''}">${hit.includes(t)?'✓ ':''}${esc(t)}</span>`).join('')}
      ${mine?`<div style="margin-top:10px">Your summary mentions <b>${hit.length}/${terms.length}</b>. Missing: ${terms.filter(t=>!hit.includes(t)).map(esc).join(', ')||'none'}.</div>`:''}</div>`};
    const go=f=>run(out,key,()=>askJSON(`You are a study coach. Summarize the paper and${mine?' compare it with the learner\'s summary':' list its key concepts'}.
PAPER (may be truncated): """${paper.slice(0,60000)}"""
${mine?`LEARNER'S SUMMARY: """${mine.slice(0,8000)}"""`:''}
JSON schema: {"summary":"6–9 sentence summary: problem, method, key results, limitations","key_concepts":[{"concept":"","why":"why it matters in this paper"}] (6–10 items)${mine?`,"covered":["key concepts the learner captured correctly"],"missing":[{"concept":"","why_it_matters":""}],"inaccurate":[{"claim":"what the learner wrote that is wrong or overstated","correction":"what the paper actually says"}],"score":0-100 (coverage and accuracy),"next_step":"one concrete action to close the biggest gap"`:''}}`,'complex'),render,fallback,f);
    go(false)};
}

/* ---------- 5. Key terms ---------- */
function stTerms(B,T,M){
  B.innerHTML=head(M,T,'20 key terms sorted into 5 categories. Uses the source text if you\'ve pasted one (shared with Summarize & compare); otherwise the topic.')+sourceBox('kt')+
  `<div class="row" style="margin-top:10px"><button class="btnp" id="ktGo">Extract terms</button><label class="row" style="font-size:13px"><input type="checkbox" id="ktQ" ${ST.quiz?'checked':''}> Quiz mode (hide definitions — click to reveal)</label></div><div id="out" style="margin-top:14px"></div>`;
  bindSource('kt',T);const out=$('#out');
  let last=null;const render=v=>{last=v;out.innerHTML=`<div class="tgrid">${(v.categories||[]).map((c,ci)=>`<div class="lvcard" style="border-top:3px solid ${['#4cc9f0','#f9a826','#c77dff','#3fb950','#f85149'][ci%5]}"><h4>${esc(c.name)}</h4><div style="font-size:12px;color:var(--muted);margin-bottom:6px">${esc(c.why||'')}</div>${(c.terms||[]).map(t=>`<div class="term ${ST.quiz?'hid':''}"><b>${esc(t.term)}</b><span>${esc(t.definition||'')}</span></div>`).join('')}</div>`).join('')}</div>${regen('rg')}`;
    out.querySelectorAll('.term').forEach(e=>e.onclick=()=>e.classList.toggle('hid'));const r=$('#rg');if(r)r.onclick=()=>go(true)};
  $('#ktQ').onchange=e=>{ST.quiz=e.target.checked;if(last)render(last)};
  const fallback=m=>{const src=ST.paper.trim()||(T.n?strip(T.n.s+' '+T.n.ex)+' '+T.n.code:'');const terms=topTerms(src,20);
    out.innerHTML=note(m+' Offline extraction is frequency-based and can\'t categorize meaningfully — try sorting these 20 into 5 categories yourself.')+`<div class="card">${terms.map(t=>`<span class="lk" style="display:inline-block;margin:3px">${esc(t)}</span>`).join('')||'Add source text first.'}</div>`};
  const go=f=>{const src=ST.paper.trim();run(out,'kt|'+(src?hsh(src):T.label),()=>askJSON(`Identify exactly 20 key terms ${src?`from this source:\n"""${src.slice(0,60000)}"""`:`a learner must know for this topic. ${ctxOf(T)}`}
Group them into exactly 5 meaningful categories of 4 terms each (e.g. core concepts, methods, metrics, architecture parts, pitfalls — choose what fits). Each definition: one sentence${src?', grounded in how the source uses it':''}.
JSON schema: {"categories":[{"name":"","why":"what unites these terms","terms":[{"term":"","definition":""}]}]}`,'default'),render,fallback,f)};
  $('#ktGo').onclick=()=>go(false);
  const ck=S.cache['kt|'+(ST.paper.trim()?hsh(ST.paper.trim()):T.label)];if(ck)render(ck);
}

/* ---------- 6. Bloom's ---------- */
function bloomOffline(T){const n=T.n;if(!n)return BLOOM.map(l=>({level:l,task:{Remember:`List the key terms of ${T.label} and define each in one line.`,Understand:`Explain ${T.label} in your own words to a classmate.`,Apply:`Describe how you'd use ${T.label} on a real problem.`,Analyze:`Break ${T.label} into parts and explain how they interact.`,Evaluate:`When is ${T.label} the wrong choice? Defend your answer.`,Create:`Design a small project that demonstrates ${T.label}.`}[l],success:[]}));
  const w=n.q.o.find(o=>!o[1]);
  return[{level:'Remember',task:`Define "${n.t}" in one sentence and name 3 key terms it involves.`,success:[strip(n.s).split('. ')[0]]},
   {level:'Understand',task:n.xb?n.xb.p:`Explain ${n.t} in your own words, with an example of your own (not the course's).`,success:n.xb?n.xb.keys.map(k=>k[0]):[]},
   {level:'Apply',task:n.f?`Fill the blank and explain what the line does: ${n.f.code}`:`Apply ${n.t} to this scenario: ${strip(n.ex)} — what would you do, step by step?`,success:n.f?['Blank = '+n.f.ans[0].replace(/\\/g,''),n.f.why]:[]},
   {level:'Analyze',task:n.pre.length?`Compare ${n.t} with ${byId[n.pre[0]].t}: what does it add, what does it depend on, where do they differ?`:`Break ${n.t} into its components and explain how they interact.`,success:[]},
   {level:'Evaluate',task:`Judge this claim — "${strip(w[0])}" — as an answer to: "${strip(n.q.q)}". Right or wrong? Defend your verdict.`,success:['Verdict: wrong. '+w[2]]},
   {level:'Create',task:`Design a small experiment or mini-project that demonstrates ${n.t}: data, method, and how you'd know it worked.`,success:['Clear data source','A measurable success criterion','A baseline or control to compare against']}];
}
function stBloom(B,T,M){
  B.innerHTML=head(M,T,'Climb from recall to creation. Each level gets its own challenge and graded feedback with corrections.')+'<div id="out"></div>';
  const out=$('#out'),key='bl|'+T.label;const rec=(S.bloom[T.label]=S.bloom[T.label]||{});
  const render=(v,isOff)=>{const L=(v.levels||[]).slice(0,6);
    out.innerHTML=`<div class="ladder">${BLOOM.map(l=>`<span class="${rec[l]>=3?'done':rec[l]?'part':''}">${l}</span>`).join('<i>→</i>')}</div>`+
    L.map((x,i)=>`<div class="card bl" style="margin-bottom:12px"><div class="row" style="justify-content:space-between"><b>${i+1}. ${esc(x.level)}</b>${rec[x.level]?`<span style="font-size:12px;color:${rec[x.level]>=3?'#3fb950':'#d29922'}">best ${'★'.repeat(rec[x.level])}</span>`:''}</div>
      <div style="margin:6px 0">${fmt(x.task)}</div>
      <textarea id="ba${i}" placeholder="Your response…">${esc(ST.ans[key+i]||'')}</textarea><div class="row" style="margin-top:6px"><button class="btnp" data-i="${i}">${AI?'Get feedback':'Self-check'}</button></div><div id="bf${i}" style="margin-top:8px"></div></div>`).join('')+(isOff?'':regen('rg'));
    out.querySelectorAll('[data-i]').forEach(b=>b.onclick=async()=>{const i=+b.dataset.i,x=L[i],a=$('#ba'+i).value;ST.ans[key+i]=a;
      const crit=(x.success||[]).length?`<ul class="ck">${x.success.map(s=>`<li>☐ ${esc(s)}</li>`).join('')}</ul>`:'Compare against the concept notes in the graph.';
      let r=null;if(AI)r=await feedback($('#bf'+i),`Bloom's level "${x.level}": ${x.task}${(x.success||[]).length?' Success criteria: '+x.success.join('; '):''}`,a,T,crit);
      else if(x.level==='Understand'&&T.n&&T.n.xb&&a.trim()){const g=gradeExplain(T.n.xb,a);r={score:g.pass?3:2};$('#bf'+i).innerHTML=`<div class="fb ${g.pass?'good':'tip'}"><b>${g.score}/${T.n.xb.keys.length} key ideas</b><ul class="ck">${T.n.xb.keys.map((k,j)=>`<li>${g.hits[j]?'✅':'⬜'} ${k[0]}</li>`).join('')}</ul>${g.traps.map(t=>'⚠ '+t[1]).join('<br>')}</div>`}
      else await feedback($('#bf'+i),x.task,a,T,crit);
      if(r){const s=clampScore(r.score);if(!rec[x.level]||s>rec[x.level]){rec[x.level]=s;save()}if(s>=3)addXP(6);render(v,isOff);$('#bf'+i).innerHTML=AI?fbHTML(r):$('#bf'+i).innerHTML}});
    const rg=$('#rg');if(rg)rg.onclick=()=>go(true)};
  const fallback=m=>{render({levels:bloomOffline(T)},true);out.insertAdjacentHTML('afterbegin',note(m))};
  const go=f=>run(out,key,()=>askJSON(`Create Bloom's taxonomy challenges. ${ctxOf(T)}
One challenge for each level, in order: Remember, Understand, Apply, Analyze, Evaluate, Create. Make them concrete and ML-specific, answerable in writing in 2–10 minutes. Apply should include a small numeric, code, or scenario task. Evaluate should ask the learner to judge a specific (possibly flawed) claim or design choice. Create should ask them to design something (experiment, pipeline, model, explainer).
JSON schema: {"levels":[{"level":"Remember","task":"","success":["2–4 short success criteria"]}]}`),render,fallback,f);
  go(false);
}

/* ---------- 7. Analogies ---------- */
function stAnalogy(B,T,M){
  B.innerHTML=head(M,T,'Analogies map the new idea onto something familiar. Every analogy breaks somewhere — knowing where is part of understanding.')+'<div id="out"></div>';
  const out=$('#out'),key='an|'+T.label;
  const own=v=>`<div class="insight" style="max-width:none"><h4>Your turn</h4>${fmt(v&&v.check?v.check:'Write your own analogy for '+T.label+', and say where it breaks down.')}<textarea id="anA" style="margin-top:8px" placeholder="X is like … because … — but it breaks down when …"></textarea><div class="row" style="margin-top:6px"><button class="btnp" id="anG">${AI?'Critique my analogy':'Self-check'}</button></div><div id="anF" style="margin-top:8px"></div></div>`;
  const bindOwn=()=>{$('#anG').onclick=()=>feedback($('#anF'),'Write your own analogy for '+T.label+' and state where it breaks down. Judge: what maps correctly, what is misleading, whether the breakdown is identified.',$('#anA').value,T,'Check: does each part of your analogy map to a real part of the concept? Did you name where it fails?')};
  const render=v=>{out.innerHTML=(v.one_liner?`<div class="card" style="font-size:15px;margin-bottom:12px">💡 ${fmt(v.one_liner)}</div>`:'')+
    `<div class="lvgrid">${(v.analogies||[]).map(a=>`<div class="lvcard" style="border-top:3px solid #c77dff"><h4>${esc(a.title||'Analogy')}</h4>${fmt(a.analogy)}
     ${(a.mapping||[]).length?`<table class="map">${a.mapping.map(m=>`<tr><td>${esc(m.concept_part)}</td><td>↔</td><td>${esc(m.analogy_part)}</td></tr>`).join('')}</table>`:''}
     ${a.breaks_down?`<div class="corr">⚠ <b>Where it breaks:</b> ${esc(a.breaks_down)}</div>`:''}</div>`).join('')}</div>
     <div class="sec"><h3>Real-life examples</h3><div class="lvgrid">${(v.real_life||[]).map(r=>`<div class="lvcard" style="border-top:3px solid #f9a826"><h4>${esc(r.domain||'')}</h4>${fmt(r.example)}</div>`).join('')}</div></div>${own(v)}${regen('rg')}`;
    bindOwn();const r=$('#rg');if(r)r.onclick=()=>go(true)};
  const fallback=m=>{out.innerHTML=note(m)+(T.n?`<div class="lvcard" style="border-top:3px solid #f9a826"><h4>Real-life example</h4>${T.n.ex}</div>`:'')+own(null);bindOwn()};
  const go=f=>run(out,key,()=>askJSON(`Help a learner understand a concept through analogies and real-life examples. ${ctxOf(T)}
Give 3 analogies from different everyday domains (e.g. cooking, sports, travel, school, shipping). For each: a short title, the analogy (2–4 sentences), a mapping of concept parts to analogy parts (3–4 pairs), and where the analogy breaks down. Then 4 real-life examples where this concept is actually used (name the industry/product type, say how). Finish with a one-line intuition and a prompt asking the learner to craft their own analogy.
JSON schema: {"one_liner":"","analogies":[{"title":"","analogy":"","mapping":[{"concept_part":"","analogy_part":""}],"breaks_down":""}],"real_life":[{"domain":"","example":""}],"check":""}`),render,fallback,f);
  go(false);
}

/* init */
const TL=LABS[ti()];
$('#todayBox').innerHTML=`📌 Topic of the day: <b>${TL.short}</b><button id="todayGo">Open lab</button>`;
$('#todayGo').onclick=()=>openLab(TL.id);
place();refreshGraph();
const h0=location.hash.slice(1);
if(byId[h0])select(h0);else renderPanel();
requestAnimationFrame(()=>{fit();fit._done=1});
</script>
